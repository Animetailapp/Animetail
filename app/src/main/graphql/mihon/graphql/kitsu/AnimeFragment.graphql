fragment AnimeFragment on Anime {
  id
  titles {
    preferred
  }
  episodeCount
  staff(first: 5) {
    nodes {
      role
      person {
        name
      }
    }
  }
  posterImage {
    views(names: "small") {
      name
      url
    }
    original {
      name
      url
    }
  }
  description(locales: "en")
  status
  subtype
  startDate
  slug
  averageRating
}
